[versions]
agp = "9.1.1"
kotlin = "2.4.20"
compose-bom = "2025.10.01"
activity = "1.11.0"
lifecycle = "2.9.4"
coroutines = "1.11.0"
datastore = "1.1.7"
core = "1.19.0"
mozilla = "158.0.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
